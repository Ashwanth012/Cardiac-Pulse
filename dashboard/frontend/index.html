<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>CardioPulse · PS-06 Cardiac Admissions Intelligence</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070B18'/%3E%3Cpath d='M4 17h6l3-7 5 13 3-6h7' fill='none' stroke='%2322D3EE' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // apply the saved / requested theme before first paint (avoids a flash)
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var t = q || localStorage.getItem("ps06-theme") || "dark";
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
